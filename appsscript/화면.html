<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  body { font-family: -apple-system, "Malgun Gothic", sans-serif;
         font-size: 13px; line-height: 1.6; padding: 8px; margin: 0; }
  h3 { font-size: 14px; margin: 18px 0 6px; }
  .글감 { border: 1px solid #d0d0d0; border-radius: 8px; padding: 9px 11px;
          margin-bottom: 6px; cursor: pointer; background: #fff; }
  .글감:hover { border-color: #1a73e8; background: #f5f9ff; }
  .작은글씨 { font-size: 11px; color: #666; }
  .키워드 { font-weight: 600; margin-top: 2px; }
  textarea { width: 100%; font-family: ui-monospace, monospace; font-size: 11px;
             padding: 8px; border: 1px solid #ccc; border-radius: 6px;
             box-sizing: border-box; resize: vertical; }
  button { font-size: 13px; padding: 8px 14px; border-radius: 6px;
           border: 1px solid #ccc; background: #fff; cursor: pointer; }
  button.주 { background: #1a73e8; color: #fff; border-color: #1a73e8; }
  button:disabled { opacity: .5; cursor: default; }
  .줄 { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
  .오류 { border: 1px solid #d93025; border-radius: 8px; padding: 10px 12px;
          margin: 12px 0; background: #fff5f5; }
  .오류 b { color: #d93025; }
  .오류 ul { margin: 6px 0 0; padding-left: 18px; }
  .성공 { border: 1px solid #188038; border-radius: 8px; padding: 10px 12px;
          margin: 12px 0; background: #f2fbf5; }
  .성공 b { color: #188038; }
  .안내 { color: #666; font-size: 12px; }
  .뒤로 { color: #1a73e8; cursor: pointer; font-size: 12px;
          display: inline-block; padding: 6px 0; }

  /* 아이패드·폰에서 주소로 열었을 때.
     손가락으로 누르는 화면이라 글씨와 버튼을 키우고, 넓은 화면에서는
     글이 너무 퍼지지 않게 가운데로 모은다. */
  @media (min-width: 500px) {
    body { font-size: 15px; max-width: 760px; margin: 0 auto; padding: 16px; }
    h3 { font-size: 17px; }
    button { font-size: 15px; padding: 12px 18px; }
    .글감 { padding: 14px 16px; }
    .키워드 { font-size: 16px; }
    textarea { font-size: 13px; }
    .안내 { font-size: 13px; }
  }
  /* 아이폰 사파리는 글씨가 16px 보다 작으면 입력할 때 화면을 확대해 버린다 */
  @media (pointer: coarse) {
    textarea { font-size: 16px; }
    button { min-height: 44px; }
  }
</style>
</head>
<body>

<div id="목록화면">
  <div class="안내" id="목록안내">불러오는 중입니다...</div>

  <div id="확인줄" style="display:none; margin:10px 0 4px">
    <button id="확인버튼" onclick="발행확인하기(this)">🔎 발행됐는지 확인</button>
    <div class="안내" style="margin-top:4px">
      블로그를 직접 보고, 올라간 글은 <b>발행완료</b> 탭으로 옮깁니다.
    </div>
  </div>
  <div id="확인결과"></div>
  <div id="거르기줄" style="display:none; margin:8px 0 10px;">
    <label style="cursor:pointer; font-size:12px;">
      <input type="checkbox" id="대기만" checked onchange="다시그리기()">
      아직 안 쓴 것만 보기
    </label>
    <span class="안내" id="개수"></span>
  </div>
  <div id="글감들"></div>
</div>

<div id="작성화면" style="display:none">
  <div class="뒤로" onclick="목록으로()">← 목록으로</div>
  <h3 id="제목"></h3>
  <div class="작은글씨" id="부제"></div>

  <div id="알림"></div>

  <div id="채널고르기" style="display:none; margin:14px 0 4px">
    <div class="안내" style="margin-bottom:4px"><b>어느 쪽 글부터 쓸까요?</b>
      (두 곳에 올리는 글감이라 한 편씩 따로 받습니다)</div>
    <label style="margin-right:12px; cursor:pointer">
      <input type="radio" name="채널" value="wordpress" onchange="요청문다시()"> 워드프레스용
    </label>
    <label style="cursor:pointer">
      <input type="radio" name="채널" value="tistory" onchange="요청문다시()"> 티스토리용
    </label>
  </div>

  <h3>1단계 · 받아올 곳에 넣을 요청문</h3>
  <div class="줄">
    <button class="주" onclick="복사하고열기(this)">📋 복사하고 My GPT 열기</button>
  </div>
  <div class="안내" style="margin:-4px 0 8px" id="붙여넣기안내">
    새 탭이 열리면 대화창에 <b>Ctrl+V</b> 로 붙여넣고 Enter 를 누르세요.
  </div>
  <div class="줄">
    <button onclick="요청문복사(this)">복사만 하기</button>
  </div>
  <textarea id="요청문" rows="6" readonly></textarea>

  <h3>2단계 · 받은 글 붙여넣기</h3>
  <textarea id="답변" rows="12"
    placeholder="받은 글을 처음부터 끝까지 전부 복사해서 여기에 붙여넣으세요."></textarea>
  <div class="줄">
    <button class="주" id="저장버튼" onclick="저장()">확인하고 저장</button>
    <span class="안내">형식이 맞을 때만 저장됩니다</span>
  </div>
</div>

<script>
var 지금행 = null;
var 지금키워드 = '';   // 행 번호가 밀렸는지 확인할 때 쓴다

/** 손가락으로 쓰는 기기인가 (아이패드·폰) */
var 손가락 = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

if (손가락) {
  var 안내칸 = document.getElementById('붙여넣기안내');
  if (안내칸) {
    안내칸.innerHTML = '새 탭이 열리면 대화창을 <b>길게 눌러</b> 붙여넣기 하세요.';
  }
}

function 목록불러오기() {
  google.script.run
    .withSuccessHandler(목록그리기)
    .withFailureHandler(오류표시)
    .글감목록();
}

var 전체목록 = [];
var GPT주소 = '';

/** 이미 저장을 마친 상태로 보는 값들 (이건 '안 쓴 것'이 아니다) */
var 끝난상태 = ['발행대기', '발행완료', '완료'];

function 목록그리기(결과) {
  전체목록 = 결과.목록;
  GPT주소 = 결과.GPT주소 || '';
  var 안내 = document.getElementById('목록안내');

  var 머리말 = '';
  if (결과.만든열 && 결과.만든열.length > 0) {
    머리말 = '<div class="성공"><b>저장할 열을 새로 만들었습니다.</b><br>'
           + 결과.만든열.join(', ') + '</div>';
  }

  document.getElementById('확인줄').style.display = 'block';

  if (전체목록.length === 0) {
    document.getElementById('거르기줄').style.display = 'none';
    안내.innerHTML = 머리말 + '오늘작성 탭에 글감이 없습니다.<br>'
                   + '시트에서 먼저 키워드를 선택해 주세요.';
    return;
  }

  안내.innerHTML = 머리말 + '글감을 하나 고르세요.';
  document.getElementById('거르기줄').style.display = 'block';
  다시그리기();
}

function 다시그리기() {
  var 대기만 = document.getElementById('대기만').checked;
  var 보일것 = 대기만
    ? 전체목록.filter(function (g) { return 끝난상태.indexOf(g.상태) === -1; })
    : 전체목록;

  document.getElementById('개수').textContent =
    ' · ' + 보일것.length + '개 / 전체 ' + 전체목록.length + '개';

  var 상자 = document.getElementById('글감들');
  상자.innerHTML = '';

  if (보일것.length === 0) {
    상자.innerHTML = '<div class="안내" style="padding:10px 2px">'
      + '아직 안 쓴 글감이 없습니다.<br>'
      + '이미 쓴 글을 다시 만들려면 위 체크를 꺼 주세요.</div>';
    return;
  }

  보일것.forEach(function (g) {
    var d = document.createElement('div');
    d.className = '글감';
    d.innerHTML = '<div class="작은글씨">' + g.행번호 + '행 · ' + g.카테고리
                + (g.상태 ? ' · ' + g.상태 : '') + '</div>'
                + '<div class="키워드">' + g.키워드 + '</div>';
    d.onclick = function () { 글감열기(g); };
    상자.appendChild(d);
  });
}

function 글감열기(g) {
  지금행 = g.행번호;
  지금키워드 = g.키워드;
  document.getElementById('제목').textContent = g.키워드;
  document.getElementById('부제').textContent = g.행번호 + '행 · ' + g.카테고리;
  document.getElementById('요청문').value = '요청문을 만드는 중입니다...';
  document.getElementById('답변').value = '';
  document.getElementById('알림').innerHTML = '';
  채널칸표시(['최신이슈','정책지원','신장정신'].indexOf(g.카테고리) !== -1);
  document.getElementById('목록화면').style.display = 'none';
  document.getElementById('작성화면').style.display = 'block';

  google.script.run
    .withSuccessHandler(function (글) {
      document.getElementById('요청문').value = 글;
    })
    .withFailureHandler(오류표시)
    .요청문만들기(g.행번호, 고른채널(), 지금키워드);
}

function 요청문다시() {
  if (!지금행) return;
  document.getElementById('요청문').value = '요청문을 다시 만드는 중입니다...';
  google.script.run
    .withSuccessHandler(function (글) {
      document.getElementById('요청문').value = 글;
    })
    .withFailureHandler(오류표시)
    .요청문만들기(지금행, 고른채널(), 지금키워드);
}

function 고른채널() {
  var r = document.querySelector('input[name="채널"]:checked');
  return r ? r.value : '';
}

/** 워드프레스와 티스토리를 모두 쓰는 카테고리에서만 선택칸을 보여준다. */
function 채널칸표시(둘다) {
  var 칸 = document.getElementById('채널고르기');
  칸.style.display = 둘다 ? 'block' : 'none';
  var wp = document.querySelector('input[name="채널"][value="wordpress"]');
  var ts = document.querySelector('input[name="채널"][value="tistory"]');
  if (둘다) {
    if (wp) wp.checked = true;      // 기본은 워드프레스용부터
    if (ts) ts.checked = false;
  } else {
    if (wp) wp.checked = false;
    if (ts) ts.checked = false;
  }
}

function 목록으로() {
  document.getElementById('작성화면').style.display = 'none';
  document.getElementById('목록화면').style.display = 'block';
  목록불러오기();
}

function 요청문복사(버튼) {
  var 칸 = document.getElementById('요청문');
  칸.select();
  document.execCommand('copy');
  var 원래 = 버튼.textContent;
  버튼.textContent = '복사했습니다';
  setTimeout(function () { 버튼.textContent = 원래; }, 1500);
  return true;
}

function 복사하고열기(버튼) {
  요청문복사(버튼);
  if (GPT주소) {
    window.open(GPT주소, '_blank');
  } else {
    document.getElementById('알림').innerHTML =
      '<div class="오류"><b>My GPT 주소가 없습니다.</b><br>'
      + '스크립트 파일 위쪽의 마이GPT주소 를 확인해 주세요.</div>';
  }
}

function 저장() {
  var 답변 = document.getElementById('답변').value;
  var 버튼 = document.getElementById('저장버튼');
  var 알림 = document.getElementById('알림');

  if (!답변.trim()) {
    알림.innerHTML = '<div class="오류"><b>붙여넣은 내용이 없습니다.</b></div>';
    return;
  }

  버튼.disabled = true;
  버튼.textContent = '확인하는 중...';
  알림.innerHTML = '';

  google.script.run
    .withSuccessHandler(function (결과) {
      버튼.disabled = false;
      버튼.textContent = '확인하고 저장';
      if (결과.성공 && 결과.더필요) {
        알림.innerHTML = '<div class="성공"><b>저장했습니다.</b><br>'
                       + 결과.안내 + 메모칸(결과.메모) + '</div>';
        document.getElementById('답변').value = '';
        var 다음 = 결과.더필요 === '티스토리' ? 'tistory' : 'wordpress';
        var r = document.querySelector('input[name="채널"][value="' + 다음 + '"]');
        if (r) r.checked = true;
        요청문다시();
      } else if (결과.성공) {
        알림.innerHTML = '<div class="성공"><b>저장했습니다.</b><br>'
                       + '각 열에 나눠 넣고 상태를 <b>' + 결과.상태
                       + '</b> 로 바꿨습니다.' + 메모칸(결과.메모) + '</div>';
        document.getElementById('답변').value = '';
      } else {
        var 목록 = 결과.문제들.map(function (p) {
          return '<li>' + p + '</li>';
        }).join('');
        알림.innerHTML = '<div class="오류"><b>저장하지 않았습니다.</b> '
                       + '아래를 고쳐서 다시 붙여넣어 주세요.<ul>' + 목록 + '</ul></div>';
      }
    })
    .withFailureHandler(function (e) {
      버튼.disabled = false;
      버튼.textContent = '확인하고 저장';
      오류표시(e);
    })
    .저장하기(지금행, 답변, 고른채널(), 지금키워드);
}

/** 블로그를 직접 보고 발행 여부를 확인한다. */
function 발행확인하기(버튼) {
  var 칸 = document.getElementById('확인결과');
  버튼.disabled = true;
  버튼.textContent = '확인하는 중입니다...';
  칸.innerHTML = '<div class="안내" style="margin:8px 0">'
               + '블로그마다 글을 찾아보고 있습니다. 글감이 많으면 조금 걸립니다.</div>';

  google.script.run
    .withSuccessHandler(function (결과) {
      버튼.disabled = false;
      버튼.textContent = '🔎 발행됐는지 확인';
      칸.innerHTML = 확인결과그리기(결과);
      목록불러오기();
    })
    .withFailureHandler(function (e) {
      버튼.disabled = false;
      버튼.textContent = '🔎 발행됐는지 확인';
      오류표시(e);
    })
    .발행확인();
}

var 판정색 = { '발행완료': '#188038', '아직': '#8a6d00',
               '확인 실패': '#d93025', '건너뜀': '#888' };

function 확인결과그리기(결과) {
  var 목록 = 결과.결과 || [];
  if (목록.length === 0) {
    return '<div class="안내" style="margin:8px 0">확인할 글감이 없습니다.</div>';
  }

  var 줄 = 목록.map(function (r) {
    return '<li><b style="color:' + (판정색[r.판정] || '#333') + '">'
         + r.판정 + '</b> · ' + r.키워드
         + '<div class="작은글씨">' + r.설명 + '</div></li>';
  }).join('');

  var 머리 = 결과.옮긴수 > 0
    ? '<div class="성공"><b>' + 결과.옮긴수 + '개를 ' + 결과.완료탭
      + ' 탭으로 옮겼습니다.</b>'
      + (결과.새탭만듦 ? '<br>' + 결과.완료탭 + ' 탭이 없어서 새로 만들었습니다.' : '')
      + '</div>'
    : '';

  return 머리 + '<div style="margin:8px 0"><ul style="padding-left:18px; margin:4px 0">'
       + 줄 + '</ul></div>';
}

/** 저장하면서 알아서 맞춘 것들을 알려 준다. */
function 메모칸(메모) {
  if (!메모 || !메모.length) return '';
  var 줄 = 메모.map(function (m) { return '<li>' + m + '</li>'; }).join('');
  return '<div style="margin-top:8px; font-size:12px; color:#555">'
       + '형식이 달라서 이렇게 맞췄습니다:<ul style="margin:4px 0 0; padding-left:18px">'
       + 줄 + '</ul></div>';
}

function 오류표시(e) {
  var 글 = (e && e.message) ? e.message : String(e);
  document.getElementById('알림').innerHTML =
    '<div class="오류"><b>문제가 생겼습니다.</b><br>'
    + 글.replace(/\n/g, '<br>') + '</div>';
  document.getElementById('목록안내').innerHTML =
    '<div class="오류"><b>문제가 생겼습니다.</b><br>'
    + 글.replace(/\n/g, '<br>') + '</div>';
}

목록불러오기();
</script>
</body>
</html>
